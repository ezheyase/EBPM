<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate BPM</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            text-align: center; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            background: #121212; 
            color: white; 
        }
        .header { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-around; }
        .tab-btn { background: none; border: none; color: #888; font-size: 1.2em; font-weight: bold; cursor: pointer; padding: 10px; }
        .tab-btn.active { color: #ff4b4b; border-bottom: 2px solid #ff4b4b; }
        .container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        #heart-icon { width: 100px; height: 100px; transition: transform 0.1s; margin-bottom: 10px; }
        .beat { transform: scale(1.3); }
        
        #bpm-display { font-size: 5em; font-weight: 900; margin: 10px 0; }
        #health-status { font-size: 1.5em; font-weight: bold; margin-bottom: 10px; padding: 5px 15px; border-radius: 10px; }
        #log-text { color: #aaaaaa; height: 40px; margin-bottom: 20px; }
        
        .action-btn { padding: 15px 40px; font-size: 1.2em; border-radius: 50px; border: none; background: #ff4b4b; color: white; cursor: pointer; font-weight: bold; margin: 5px; }
        .action-btn:hover { background: #ff3333; }
        
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <button id="tab-cam" class="tab-btn active">Camera Mode</button>
        <button id="tab-mic" class="tab-btn">Mic Mode</button>
    </div>

    <div class="container">
        <img id="heart-icon" src="heart.png" alt="Heart" onerror="this.style.display='none'">
        <div id="bpm-display">--</div>
        <div id="health-status" style="display:none;"></div>
        <div id="log-text">Choose a mode and start.</div>
        
        <button id="start-cam-btn" class="action-btn">Start Camera</button>
        <button id="start-mic-btn" class="action-btn" style="display:none;">Start Mic</button>
        <button id="stop-btn" class="action-btn" style="display:none; background:#555;">Stop</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="30" height="30"></canvas>
    <script src="app.js"></script>
</body>
</html>
